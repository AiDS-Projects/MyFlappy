# asset_manifest.yaml — 实现随分数递增的难度曲线计算函数
# 由 ArtistAgent 落地更新
# status: sourced=命中资产库 / placeholder=占位图待替换 / manual_required=需人工提供 / not_found=未命中
assets:
  - id: icon_pause
    type: icon
    description: 暂停图标 24px outline 白色
    status: sourced
    path: icons/lucide/pause.svg
    matched_name: pause
    asset_db_id: AST-001169
    match_score: 1.0
  - id: icon_play
    type: icon
    description: 开始/继续图标 24px outline 白色
    status: sourced
    path: icons/lucide/play.svg
    matched_name: play
    asset_db_id: AST-001210
    match_score: 1.0
  - id: icon_restart
    type: icon
    description: 重新开始图标 24px outline 白色
    status: sourced
    path: icons/lucide/list-restart.svg
    matched_name: list-restart
    asset_db_id: AST-000952
    match_score: 0.7
  - id: icon_home
    type: icon
    description: 返回首页图标 24px outline 白色
    status: sourced
    path: icons/tabler/home.svg
    matched_name: home
    asset_db_id: AST-005087
    match_score: 1.0
