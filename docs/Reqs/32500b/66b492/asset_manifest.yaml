# asset_manifest.yaml — 集成难度曲线到游戏循环并实现重开重置
# 由美术 Agent 完整生成，覆盖 UX Agent 的初稿
# status: pending=待生产 / sourced=已从资产库获取 / generated=已AI生成
assets:
  - id: bird_idle
    type: sprite
    description: 小鸟飞行精灵 3 帧循环（翅膀上/中/下） 34x24px
    source_hint: existing
    status: pending
  - id: pipe_up
    type: sprite
    description: 上管道精灵 52x320px 含高光/暗部
    source_hint: existing
    status: pending
  - id: pipe_down
    type: sprite
    description: 下管道精灵 52x320px 含高光/暗部
    source_hint: existing
    status: pending
  - id: ground_strip
    type: sprite
    description: 地面滚动条 336x112px 可无缝平铺
    source_hint: existing
    status: pending
  - id: sky_bg
    type: sprite
    description: 远景天空/城市背景 288x512px 可平铺
    source_hint: existing
    status: pending
  - id: btn_pause
    type: icon
    description: 暂停图标 24px outline（两条竖线）
    source_hint: iconify
    status: pending
  - id: panel_base
    type: ui
    description: 通用弹窗面板背景 320x180 九宫格可拉伸
    source_hint: existing
    status: pending
  - id: btn_primary
    type: ui
    description: 主操作按钮九宫格背景（再来一局/开始/继续） 200x56
    source_hint: existing
    status: pending
  - id: btn_secondary
    type: ui
    description: 次操作按钮九宫格背景（返回菜单） 200x56
    source_hint: existing
    status: pending
  - id: btn_click
    type: audio
    description: 按钮点击音效
    source_hint: kenney
    status: pending
  - id: sfx_score
    type: audio
    description: 得分音效（穿过管道）
    source_hint: kenney
    status: pending